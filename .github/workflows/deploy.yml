name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Create maintenance page
        run: |
          mkdir -p public
          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>DNB ENT Theory Q&A — Under Maintenance</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                background: #0f1117;
                color: #e2e8f0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 2rem;
              }
              .container { max-width: 560px; }
              .icon { font-size: 3.5rem; margin-bottom: 1.5rem; }
              h1 {
                font-size: 1.8rem;
                font-weight: 700;
                color: #f8fafc;
                margin-bottom: 1rem;
                line-height: 1.3;
              }
              p {
                font-size: 1.05rem;
                color: #94a3b8;
                line-height: 1.7;
                margin-bottom: 1.2rem;
              }
              .badge {
                display: inline-block;
                background: #1e293b;
                border: 1px solid #334155;
                color: #64748b;
                font-size: 0.78rem;
                padding: 0.35rem 0.85rem;
                border-radius: 999px;
                margin-top: 1.5rem;
                letter-spacing: 0.04em;
                text-transform: uppercase;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <div class="icon">🔧</div>
              <h1>DNB ENT Theory Q&amp;A<br>is temporarily unavailable</h1>
              <p>
                This resource is currently under maintenance.<br>
                We will be back online shortly.
              </p>
              <p>
                Thank you for your patience.
              </p>
              <span class="badge">Under Maintenance</span>
            </div>
          </body>
          </html>
          EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
